const PAGE="<meta name=\"dash-one-writer\">\n<style>\n.cb{max-width:1100px;margin-inline:auto;display:flex;flex-direction:column;gap:var(--cds-gap-lg);font-family:var(--font-anthropic-sans)}\n.cb h1{font-family:var(--font-anthropic-serif);font-weight:400;font-size:var(--cds-font-size-title);margin:0}\n.cb .sub{color:var(--color-fg-muted);margin:6px 0 0;max-width:46rem}\n.cb .take{font-size:var(--cds-font-size-heading);margin:10px 0 0;max-width:46rem}\n.cb .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr));gap:var(--cds-gap-md)}\n.cb .tile,.cb .card{background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:var(--cds-pad-lg);min-width:0}\n.cb .tile .n{display:block;font-family:var(--font-anthropic-serif);font-weight:400;font-size:var(--cds-font-size-title);font-variant-numeric:tabular-nums}\n.cb .tile span.l{color:var(--color-fg-muted);font-size:var(--cds-font-size-caption)}\n.cb h2{font-size:var(--cds-font-size-heading);font-weight:var(--cds-font-weight-medium);margin:0 0 2px}\n.cb .note{color:var(--color-fg-muted);font-size:var(--cds-font-size-caption);margin:0 0 var(--cds-gap-sm)}\n.cb .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:var(--cds-gap-md)}\n.cb .box{overflow:auto;max-height:22rem}\n.cb table{border-collapse:collapse;width:100%;font-size:var(--cds-font-size-caption);font-variant-numeric:tabular-nums}\n.cb th{position:sticky;top:0;background:var(--color-panel);text-align:left;font-weight:var(--cds-font-weight-medium);color:var(--color-fg-muted);padding:6px 8px;border-bottom:1px solid var(--color-border-line)}\n.cb td{padding:6px 8px;border-bottom:1px solid var(--color-border-line)}\n.cb .chart{min-height:15rem}\n.cb .sec{border-top:1px solid var(--color-border-line);padding-top:var(--cds-gap-md)}\n.cb .sec h2{font-family:var(--font-anthropic-serif);font-weight:400;font-size:var(--cds-font-size-title);margin:0}\n.cb .sec .note{margin-top:4px}\n.cb .vs{font-size:var(--cds-font-size-heading);margin:8px 0 0;max-width:46rem}\n.cb svg text{fill:var(--color-fg-muted);font-size:11px}\n.cb .top2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--cds-gap-lg);align-items:start}\n.cb .col{display:flex;flex-direction:column;gap:var(--cds-gap-md);min-width:0}\n.cb .rings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--cds-gap-md)}\n@media(max-width:820px){.cb .top2{grid-template-columns:1fr}}\n[data-dash-source-state=empty]{color:transparent}\n<\/style>\n<div class=\"cb\">\n <div>\n  <h1>Winterization crew board<\/h1>\n  <p class=\"sub\">Updated @@UPDATED@@<\/p>\n <\/div>\n <div class=\"top2\">\n  <div class=\"card\"><h2>Season progress<\/h2>\n   <div class=\"rings\"><div class=\"chart\" data-draw=\"gaugeM\" data-source=\"prog goal\"><\/div><div class=\"chart\" data-draw=\"gaugeW\" data-source=\"prog goal\"><\/div><div class=\"chart\" data-draw=\"gaugeH\" data-source=\"prog goal\"><\/div><div class=\"chart\" data-draw=\"gaugeS\" data-source=\"prog goal\"><\/div><\/div><\/div>\n  <div class=\"col\">\n <div class=\"sec\"><h2>Tech's<\/h2>\n  <p class=\"vs\" data-draw=\"vs_mech\">—<\/p><\/div>\n <div class=\"card\"><h2>Tech's: boats finished this season vs. last two<\/h2><p class=\"note\">Percent of each season's boats, Oct 18 to Dec 31.<\/p><div class=\"chart\" data-draw=\"seasonM\" data-source=\"season\"><\/div><\/div>\n  <\/div>\n <\/div>\n <div class=\"card\"><h2>Tech's: last five weeks<\/h2><p class=\"note\">Boats finished each week, this year against the last two.<\/p><div class=\"chart\" data-draw=\"weekM\" data-source=\"season\"><\/div><\/div>\n  <div class=\"card\"><h2>Where the boats are on the Trello board<\/h2><p class=\"note\">Cards on each Trello list. Hauled here is the Trello list, not the Hauled progress ring.<\/p><div class=\"chart\" data-draw=\"stagechart\" data-source=\"stages\"><\/div><\/div>\n\n <div class=\"card\"><h2>Boats stored<\/h2><p class=\"note\">From the winterization database, as of 11/1.<\/p><div class=\"tiles\"><div class=\"tile\"><b class=\"n\" data-draw=\"s_hard\" data-source=\"stored\" data-field=\"boats\" data-where=\"location=On%20the%20hard\">—<\/b><span class=\"l\">On the hard<\/span><\/div><div class=\"tile\"><b class=\"n\" data-draw=\"s_trl\" data-source=\"stored\" data-field=\"boats\" data-where=\"location=On%20a%20trailer\">—<\/b><span class=\"l\">On a trailer<\/span><\/div><div class=\"tile\"><b class=\"n\" data-draw=\"s_wtr\" data-source=\"stored\" data-field=\"boats\" data-where=\"location=In%20the%20water\">—<\/b><span class=\"l\">In the water<\/span><\/div><div class=\"tile\"><b class=\"n\" data-draw=\"s_tot\" data-source=\"stored\" data-field=\"boats\">—<\/b><span class=\"l\">Total stored<\/span><\/div><\/div><\/div>\n <div class=\"sec\"><h2>Shrink team's<\/h2>\n  <p class=\"vs\" data-draw=\"vs_shrink\">—<\/p><\/div>\n <div class=\"card\"><h2>Shrink team's: boats finished this season vs. last two<\/h2><p class=\"note\">Percent of each season's boats, Oct 18 to Dec 31.<\/p><div class=\"chart\" data-draw=\"seasonS\" data-source=\"season\"><\/div><\/div>\n <div class=\"card\"><h2>Shrink team's: last five weeks<\/h2><p class=\"note\">Boats finished each week, this year against the last two.<\/p><div class=\"chart\" data-draw=\"weekS\" data-source=\"season\"><\/div><\/div>\n\n<p class=\"note\" style=\"margin:0\">How this is counted: Tech's work counts when a boat reaches To Shrink; shrink work counts when it reaches QA or later; hauled counts the Hauled label or any later list. Boats from 2024 and 2025 count on the last day work was logged on them. RAM and NSSC boats are left out.<\/p>\n<\/div>\n<script>\nconst AS_OF='2026-11-03',TARGET='2026-12-31';\ndash.calc('pace',{inputs:['kpis','shrink_done'],title:'Shrink pace',description:'Boats still to shrink divided by the weeks left to December 31, and boats finished per week since the earliest day in the export.',fn:(kpis,done)=>{\n const AS_OF=kpis.find(r=>r.metric==='as_of').value;const left=+kpis.find(r=>r.metric==='ahead_of_shrink').value;const day=86400000;\n const weeks=(new Date(TARGET)-new Date(AS_OF))/day/7;\n const days=done.length?(new Date(AS_OF)-new Date(done.map(r=>r.day).sort()[0]))/day+1:0;\n return [{metric:'need_per_week',value:Math.ceil(left/weeks)},{metric:'done_per_week',value:days?Math.round(done.length/(days/7)):0}];}});\nconst pv=(m)=>{const g=dash.data('pace');const r=g.status==='ok'?g.data.find(x=>x.metric===m):null;return r?+r.value:null;};\ndash.calc('prog',{inputs:['kpis'],title:'Team progress',description:'Boats finished by mechanics and by the shrink team, over all season boats on the board (RAM and NSSC excluded).',fn:(kpis)=>{const k=m=>+kpis.find(r=>r.metric===m).value;const tot=k('total_boats');return [{team:'Mechanics',done:k('mechanics_done'),total:tot,pct:Math.round(100*k('mechanics_done')/tot)},{team:'Shrink team',done:k('shrink_done'),total:tot,pct:Math.round(100*k('shrink_done')/tot)},{team:'Fresh water',done:k('water_done'),total:k('water_total'),pct:Math.round(100*k('water_done')/k('water_total'))},{team:'Hauled',done:k('hauled_done'),total:k('hauled_total'),pct:Math.round(100*k('hauled_done')/k('hauled_total'))}];}});\ndash.draw('progbars',(el)=>{const g=dash.data('prog');el.replaceChildren();if(g.status!=='ok')return;const w=el.clientWidth||360,rh=54;\n const svg=d3.select(el).append('svg').attr('width','100%').attr('viewBox',`0 0 ${w} ${g.data.length*rh}`);const x0=0,x1=w-4;\n g.data.forEach((r,i)=>{const y=i*rh,p=+r.pct/100;\n  svg.append('text').attr('x',0).attr('y',y+16).text(`${r.team}: ${r.done} of ${r.total} boats`);\n  svg.append('text').attr('x',x1).attr('y',y+16).attr('text-anchor','end').attr('font-weight','600').text(`${r.pct}%`);\n  svg.append('rect').attr('x',x0).attr('y',y+24).attr('width',x1-x0).attr('height',16).attr('rx',8).attr('fill','var(--cds-chart-muted)').attr('opacity',0.35);\n  svg.append('rect').attr('x',x0).attr('y',y+24).attr('width',Math.max(4,(x1-x0)*p)).attr('height',16).attr('rx',8).attr('fill',dash.colors[i]);});});\ndash.calc('goal',{inputs:['kpis','arrivals','shrink_done'],title:'Team goals',description:'Percent finished, boats finished in the last 7 days, and boats a week needed to be done by the target date.',fn:(kpis,arr,done)=>{const k=m=>+kpis.find(r=>r.metric===m).value;const day=86400000;const AS_OF=kpis.find(r=>r.metric==='as_of').value;\n const since=new Date(new Date(AS_OF)-7*day).toISOString().slice(0,10);const weeks=(new Date(TARGET)-new Date(AS_OF))/day/7;const tot=k('total_boats');\n const mk=(team,fin,left,rows)=>({team,pct:Math.round(100*fin/tot),week:rows.filter(r=>r.day>since).length,need:Math.ceil(left/weeks)});\n return [mk('Mechanics',k('mechanics_done'),tot-k('mechanics_done'),arr),mk('Shrink team',k('shrink_done'),k('ahead_of_shrink'),done)];}});\nconst gv=(id,team,f,fmt)=>dash.draw(id,(el)=>{const g=dash.data('goal');const r=g.status==='ok'?g.data.find(x=>x.team===team):null;el.textContent=r?fmt(r[f]):'—';});\ngv('g_mp','Mechanics','pct',v=>v+'%');gv('g_mw','Mechanics','week',v=>v);gv('g_mn','Mechanics','need',v=>v);\ngv('g_sp','Shrink team','pct',v=>v+'%');gv('g_sw','Shrink team','week',v=>v);gv('g_sn','Shrink team','need',v=>v);\nconst gauge=(id,team)=>dash.draw(id,(el)=>{el.replaceChildren();const p=dash.data('prog'),g=dash.data('goal');if(p.status!=='ok'||g.status!=='ok')return;\n const a=p.data.find(r=>r.team===team),b=g.data.find(r=>r.team===team)||{};if(!a)return;\n const w=el.clientWidth||320,h=250,R=Math.min(w/2-10,92),cx=w/2,cy=R+14,col=team==='Hauled'?dash.colors[3]:team==='Fresh water'?dash.colors[2]:team==='Mechanics'?dash.colors[1]:dash.colors[0];\n const svg=d3.select(el).append('svg').attr('width','100%').attr('viewBox',`0 0 ${w} ${h}`);\n const arc=d3.arc().innerRadius(R-22).outerRadius(R).startAngle(0).cornerRadius(11);\n svg.append('path').attr('transform',`translate(${cx},${cy})`).attr('d',arc({endAngle:2*Math.PI})).attr('fill','var(--cds-chart-muted)').attr('opacity',0.3);\n svg.append('path').attr('transform',`translate(${cx},${cy})`).attr('d',arc({endAngle:2*Math.PI*Math.max(0.012,+a.pct/100)})).attr('fill',col);\n svg.append('text').attr('x',cx).attr('y',cy+8).attr('text-anchor','middle').style('font-size','40px').style('font-family','var(--font-anthropic-serif)').style('fill','var(--color-fg)').text(`${a.pct}%`);\n svg.append('text').attr('x',cx).attr('y',cy+28).attr('text-anchor','middle').text(`${a.done} of ${a.total} boats`);\n svg.append('text').attr('x',cx).attr('y',2*R+40).attr('text-anchor','middle').style('font-size','14px').style('fill','var(--color-fg)').text(w<330?(team==='Hauled'?'Hauled':team==='Fresh water'?'Fresh water done':team==='Mechanics'?\"Tech's done\":\"Shrink team's done\"):(team==='Hauled'?'Hauled':team==='Fresh water'?'Fresh water work complete':team==='Mechanics'?\"Tech's work complete\":\"Shrink team's work complete (completely done)\"));\n svg.append('text').attr('x',cx).attr('y',2*R+58).attr('text-anchor','middle').text(b.need==null?(team==='Hauled'?'Out of the water':'Part of tech work'):(w<330?`${b.week} this week · ${b.need}/wk needed`:`${b.week} finished this week · ${b.need} a week to hit Dec 31`));});\ngauge('gaugeW','Fresh water');gauge('gaugeH','Hauled');gauge('gaugeM','Mechanics');gauge('gaugeS','Shrink team');\ndash.draw('seasonbar',(el)=>{el.replaceChildren();const g=dash.data('kpis');if(g.status!=='ok')return;const k=m=>+(g.data.find(r=>r.metric===m)||{value:0}).value;\n const tot=k('total_boats'),sd=k('shrink_done'),md=k('mechanics_done')-sd,rest=tot-sd-md;const w=el.clientWidth||360,h=78;\n const segs=[{n:sd,c:dash.colors[0],l:'Shrink finished'},{n:md,c:dash.colors[1],l:'Shrink to do'},{n:rest,c:'var(--cds-chart-muted)',l:'Mechanics to do',o:0.35}];\n const x=d3.scaleLinear([0,tot],[0,w-4]);let off=0;const svg=d3.select(el).append('svg').attr('width','100%').attr('viewBox',`0 0 ${w} ${h}`);\n segs.forEach(s=>{svg.append('rect').attr('x',2+x(off)).attr('y',4).attr('width',Math.max(0,x(s.n)-2)).attr('height',30).attr('rx',6).attr('fill',s.c).attr('opacity',s.o||1);\n  const tx=svg.append('text').attr('x',2+x(off)).attr('y',54).style('fill','var(--color-fg)').text(s.n);svg.append('text').attr('x',2+x(off)).attr('y',70).text(s.l);off+=s.n;});});\nconst sto=(id,loc)=>dash.draw(id,(el)=>{const g=dash.data('stored');const r=g.status==='ok'?g.data.find(x=>x.location===loc):null;el.textContent=r?d3.format(',')(+r.boats):'—';});\nsto('s_hard','On the hard');sto('s_trl','On a trailer');sto('s_wtr','In the water');\ndash.draw('s_tot',(el)=>{const g=dash.data('stored');el.textContent=g.status==='ok'?d3.format(',')(d3.sum(g.data,r=>+r.boats)):'—';});\nconst kv=(m)=>{const g=dash.data('kpis');const r=g.status==='ok'?g.data.find(x=>x.metric===m):null;return r?+r.value:null;};\nconst num=(f)=>(el)=>{const v=f();el.textContent=v==null?'—':d3.format(',')(v);};\ndash.draw('a_ahead',num(()=>kv('ahead_of_shrink')));dash.draw('t_ahead',num(()=>kv('ahead_of_shrink')));\ndash.draw('t_past',num(()=>kv('past_shrink')));dash.draw('t_parts',num(()=>kv('parts_complete')));dash.draw('t_haul',num(()=>kv('hauled_ahead')));\ndash.draw('a_need',num(()=>pv('need_per_week')));dash.draw('t_need',num(()=>pv('need_per_week')));\ndash.draw('a_pace',num(()=>pv('done_per_week')));dash.draw('t_pace',num(()=>pv('done_per_week')));\nconst frame=(el,h,m)=>{el.replaceChildren();const w=el.clientWidth||360;return {w,h,svg:d3.select(el).append('svg').attr('width','100%').attr('viewBox',`0 0 ${w} ${h}`)};};\nconst OWN={'Backlog':0,'With techs':0,'Hauled':0,'To Shrink':2,'QA/Final Review':3,'To Bill':3,'Generating WW Estimate':3,'WW Estimate Out':3,'Awaiting DFS':4,'Done':5};const OWNERS=[{l:\"Tech's\",c:dash.colors[1]},{l:'Backlog',c:dash.colors[1],o:0.4},{l:\"Shrink team's\",c:dash.colors[0]},{l:'Office',c:dash.colors[2]},{l:'Waiting on DFS',c:dash.colors[4]},{l:'Done',c:dash.colors[5]}];const own=(s)=>OWN[s]==null?{l:'Waiting or done',c:'var(--cds-cha async function boot(){
  const root=document.getElementById('dash-root');
