name: Refresh crew board
on:
  schedule:
    - cron: "7,37 11-23 * * *"   # every 30 minutes, 6 AM to 6 PM Eastern (UTC-5 until March)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore private state (customer-identifying files, never committed)
        env:
          STATE_PRIVATE_B64: ${{ secrets.STATE_PRIVATE_B64 }}
        run: |
          echo "$STATE_PRIVATE_B64" | base64 -d | tar -xz -C automation/state
      - name: Pull Trello (read only) and rebuild the data files
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
        run: python3 automation/run_refresh.py
      - name: Publish
        run: |
          rm -f automation/state/placeholders.csv automation/state/location_exceptions.csv
          git config user.name "crew-board-bot"
          git config user.email "crew-board-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to publish"; else git commit -m "Auto refresh $(cat updated.txt)"; git push; fi
